name: Update data

# Refreshes the IP country (DB-IP Lite) and MAC vendor (IEEE) data on the 3rd of every month.
# The repository keeps a single commit, so the update amends it; Workers Builds deploys the push.
on:
  schedule:
    - cron: '17 4 3 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:update
      - name: Check for changes
        id: diff
        run: |
          git add -A public/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Data unchanged."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat | tail -1
          fi
      - name: Test with the new data
        if: steps.diff.outputs.changed == 'true'
        run: npm run typecheck && npm test
      - name: Amend the commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          old=$(git rev-parse HEAD)
          git commit --amend --no-edit
          git push --force-with-lease=main:"$old" origin HEAD:main
