name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Generates worker-configuration.d.ts with `wrangler types`, then runs tsc.
      - run: npm run typecheck
      - run: npm test
      - name: Build without deploying
        run: npx wrangler deploy --dry-run --outdir dist
