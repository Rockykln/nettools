<!doctype html>
<!-- Template for Open Graph images (1200x630). Rendered by scripts/brand.sh with ?title=&sub=&icon= -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Inter; src: url(../public/assets/fonts/inter-latin.woff2) format('woff2'); font-weight: 100 900; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; }
body {
  font-family: Inter, sans-serif; color: #fff; position: relative;
  background:
    radial-gradient(circle at 1px 1px, rgba(255,255,255,.18) 1.2px, transparent 0) 0 0 / 28px 28px,
    linear-gradient(135deg, #1D9AF7 0%, #0B78D6 100%);
}
.globe { position: absolute; right: -150px; top: 50%; transform: translateY(-50%); width: 640px; height: 640px; opacity: .16; }
.wrap { position: absolute; inset: 64px 72px; display: flex; flex-direction: column; }
.brand { display: flex; align-items: center; gap: 16px; font-weight: 700; font-size: 34px; letter-spacing: -0.02em; }
.brand svg { width: 56px; height: 56px; filter: drop-shadow(0 4px 14px rgba(0,0,0,.18)); }
.main { margin-top: auto; margin-bottom: auto; max-width: 820px; }
.tool-icon { width: 76px; height: 76px; border-radius: 12px; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center; margin-bottom: 26px; }
.tool-icon[hidden] { display: none; }
.tool-icon svg { width: 46px; height: 46px; color: #fff; }
h1 { font-size: 78px; line-height: 1.04; margin: 0 0 18px; font-weight: 800; letter-spacing: -0.035em; text-wrap: balance; }
p { font-size: 32px; line-height: 1.3; margin: 0; color: rgba(255,255,255,.92); font-weight: 500; text-wrap: balance; }
.foot { display: flex; align-items: center; justify-content: space-between; font-size: 26px; font-weight: 600; }
.chips { display: flex; gap: 12px; }
.chip { background: #0B5EA8; border-radius: 10px; padding: 8px 18px; font-size: 22px; font-weight: 600; }
.url { background: #fff; color: #0B5EA8; border-radius: 10px; padding: 10px 20px; }
</style>
</head>
<body>
<svg class="globe" viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="1.6"><circle cx="32" cy="32" r="30"/><ellipse cx="32" cy="32" rx="13" ry="30"/><ellipse cx="32" cy="32" rx="24" ry="30"/><path d="M2 32h60M6 17h52M6 47h52"/></svg>
<div class="wrap">
  <div class="brand"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#fff"/><g fill="none" stroke="#1D9AF7" stroke-width="3.5"><circle cx="32" cy="32" r="18"/><ellipse cx="32" cy="32" rx="8" ry="18"/><path d="M14 32h36"/></g><circle cx="45" cy="20" r="6.5" fill="#FFC53D" stroke="#fff" stroke-width="3"/></svg>nettools</div>
  <div class="main">
    <div class="tool-icon" id="icon" hidden><svg><use id="use" href=""/></svg></div>
    <h1 id="title">Free network tools</h1>
    <p id="sub">IP address, speed test, DNS and WHOIS – fast, open source, without ads or cookies.</p>
  </div>
  <div class="foot">
    <div class="chips"><span class="chip">No sign-up</span><span class="chip">No ads</span><span class="chip">No cookies</span><span class="chip">Open source</span></div>
    <span class="url">net.rockykln.com</span>
  </div>
</div>
<script>
const q = new URLSearchParams(location.search);
if (q.get('title')) document.getElementById('title').textContent = q.get('title');
if (q.get('sub')) document.getElementById('sub').textContent = q.get('sub');
if (q.get('icon')) {
  document.getElementById('use').setAttribute('href', `../public/assets/icons.svg#i-${q.get('icon')}`);
  document.getElementById('icon').hidden = false;
}
</script>
</body>
</html>
